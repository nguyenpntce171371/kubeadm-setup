apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql"
  replicas: 3
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
        - name: init-mysql
          image: mysql:8.0
          command:
            - bash
            - "-c"
            - |
              # Xác định pod index
              [[ ${HOSTNAME} =~ -([0-9]+)$ ]] || exit 1
              ordinal=${BASH_REMATCH[1]}
              
              # Tạo thư mục log và chỉnh quyền
              mkdir -p /var/log/mysql
              chown -R mysql:mysql /var/log/mysql
              
              # Copy cấu hình master/slave về đúng /etc/my.cnf
              if [[ $HOSTNAME == "mysql-0" ]]; then
                cp /mnt/master-config/my.cnf /etc/my.cnf
              else
                sed "s/server-id=2/server-id=$((ordinal + 1))/" /mnt/slave-config/my.cnf > /etc/my.cnf
              fi
          volumeMounts:
            - name: master-config
              mountPath: /mnt/master-config
            - name: slave-config
              mountPath: /mnt/slave-config
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "nguyen"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: master-config
              mountPath: /mnt/master-config
              subPath: mysql-master-config
            - name: slave-config
              mountPath: /mnt/slave-config
              subPath: mysql-slave-config
            - name: mysql-sample-data
              mountPath: /docker-entrypoint-initdb.d/mysqlsampledatabase.sql
              subPath: mysqlsampledatabase.sql
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - "-c"
                  - |
                    # Chờ MySQL khởi động hoàn toàn
                    sleep 30
                    
                    # Chỉ thực hiện trên master (mysql-0)
                    if [[ `hostname` == "mysql-0" ]]; then
                      mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "
                        CREATE USER 'repl'@'%' IDENTIFIED BY 'repl_password';
                        GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';
                        FLUSH PRIVILEGES;
                      "
                    else
                      # Chờ master sẵn sàng
                      until mysql -h mysql-0.mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1"; do
                        sleep 5
                      done
                      
                      # Thiết lập replication
                      mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "
                        CHANGE MASTER TO
                        MASTER_HOST='mysql-0.mysql',
                        MASTER_USER='repl',
                        MASTER_PASSWORD='repl_password',
                        MASTER_AUTO_POSITION=1;
                        START SLAVE;
                      "
                    fi
      volumes:
        - name: master-config
          configMap:
            name: mysql-config
        - name: slave-config
          configMap:
            name: mysql-config
        - name: mysql-sample-data
          configMap:
            name: mysql-sample-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: manual
