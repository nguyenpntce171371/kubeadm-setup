apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql"
  replicas: 3
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
        - name: init-mysql
          image: mysql:8.0
          command:
            - bash
            - "-c"
            - |
              ordinal=$(echo $HOSTNAME | grep -oE '[0-9]+$')
              
              mkdir -p /var/log/mysql
              chown -R mysql:mysql /var/log/mysql
              
              if [[ "$ordinal" == "0" ]]; then
                cp /mnt/config/mysql-master-config /etc/my.cnf
              else
                cp /mnt/config/mysql-slave-config /etc/my.cnf
                sed -i "s/server-id=2/server-id=$((ordinal + 1))/" /etc/my.cnf
              fi
          volumeMounts:
            - name: mysql-config
              mountPath: /mnt/config
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "nguyen"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: mysql-sample-data
              mountPath: /docker-entrypoint-initdb.d/mysqlsampledatabase.sql
              subPath: mysqlsampledatabase.sql
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - "-c"
                  - |
                    sleep 30
                    
                    if [[ `hostname` == "mysql-0" ]]; then
                      mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "
                        CREATE USER 'repl'@'%' IDENTIFIED BY 'repl_password';
                        GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';
                        FLUSH PRIVILEGES;
                      "
                    else
                      until mysql -h mysql-0.mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1"; do
                        sleep 5
                      done
                      
                      mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "
                        CHANGE MASTER TO
                        MASTER_HOST='mysql-0.mysql',
                        MASTER_USER='repl',
                        MASTER_PASSWORD='repl_password',
                        MASTER_AUTO_POSITION=1;
                        START SLAVE;
                      "
                    fi
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config
        - name: mysql-sample-data
          configMap:
            name: mysql-sample-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: manual
