apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv-0
  labels:
    type: local
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mysql-0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-storage-mysql-0
  namespace: mysql-ha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
