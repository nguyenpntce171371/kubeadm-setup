apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv-0
spec:
  storageClassName: local-storage
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mysql-0"
