apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-mysql-0
  labels:
    app: mysql
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data-mysql-0
---
