apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  serviceName: "mysql"
  replicas: 3
  selector:
    matchLabels:
      app: mysql
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "your_password"
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 10
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - "-c"
                  - |
                    ordinal=$(echo $HOSTNAME | grep -o '[0-9]\+$')

                    timeout 60s bash -c 'until mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do sleep 2; done' || exit 1

                    if [[ "$ordinal" == "0" ]]; then
                      mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
                      SET GLOBAL server_id = $((ordinal + 1));
                      SET GLOBAL binlog_format = 'ROW';
                      SET GLOBAL enforce_gtid_consistency = 'ON';
                      SET GLOBAL read_only = OFF;
                      SET GLOBAL enforce_gtid_consistency = ON;
                      SET GLOBAL gtid_mode = OFF_PERMISSIVE;
                      SET GLOBAL gtid_mode = ON_PERMISSIVE;
                      SET GLOBAL gtid_mode = ON;
                      CREATE USER IF NOT EXISTS 'replica'@'%' IDENTIFIED WITH mysql_native_password BY 'replica_password';
                      GRANT REPLICATION SLAVE ON *.* TO 'replica'@'%';
                      FLUSH PRIVILEGES;"
                    else
                      mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
                      SET GLOBAL server_id = $((ordinal + 1));
                      SET GLOBAL read_only = 1;
                      SET GLOBAL enforce_gtid_consistency = ON;
                      SET GLOBAL gtid_mode = OFF_PERMISSIVE;
                      SET GLOBAL gtid_mode = ON_PERMISSIVE;
                      SET GLOBAL gtid_mode = ON;
                      STOP SLAVE;
                      RESET SLAVE ALL;
                      CHANGE MASTER TO
                      MASTER_HOST='mysql-0.mysql.default.svc.cluster.local',
                      MASTER_USER='replica',
                      MASTER_PASSWORD='replica_password',
                      MASTER_AUTO_POSITION=1;
                      START SLAVE;"
                    fi
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-sample-data
            defaultMode: 420
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: 
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: manual
        volumeMode: Filesystem
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
