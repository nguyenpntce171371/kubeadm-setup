apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
  labels:
    app: mysql
spec:
  containers:
    - name: mysql
      image: mysql:8.0
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: "nguyen"
      ports:
        - containerPort: 3306
      volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: mysql-master-config
          mountPath: /etc/mysql/conf.d/mysql-master.cnf
          subPath: mysql-master.cnf
        - name: mysql-slave-config
          mountPath: /etc/mysql/conf.d/mysql-slave.cnf
          subPath: mysql-slave.cnf
      lifecycle:
        postStart:
          exec:
            command:
              - bash
              - "-c"
              - |
                ordinal=$(echo $HOSTNAME | grep -o '[0-9]\+$')
                if [[ "$ordinal" != "0" ]]; then
                  sed -i "s/server-id=2/server-id=$((ordinal + 1))/" /etc/mysql/conf.d/mysql-master.cnf
                fi
                cp /etc/mysql/conf.d/mysql-master.cnf /etc/my.cnf

  volumes:
    - name: mysql-master-config
      configMap:
        name: mysql-master-config
    - name: mysql-slave-config
      configMap:
        name: mysql-slave-config
